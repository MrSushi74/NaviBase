<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" sizes="32x32" href="../imageNvideo/navi-x-icon.jpg">
  <title>Login</title>
  <link rel="stylesheet" href="../CSS/registration.css">
  <script type="text/javascript" src="../JS/registration.js" defer></script>
</head>
<body>
  <div class="Swrapper">
    <h1>Login</h1>
    <p id="error-message"></p>
    <form id="form" action="../HTML/main.html">
      <div>
        <a href="../HTML/main.html" style="position: absolute; top: 7%; left: 5%;">RETURN</a>
        <label for="email-input">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#5f6368"><path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm320-280L160-640v400h640v-400L480-440Zm0-80 320-200H160l320 200ZM160-640v-80 480-400Z"/></svg>
        </label>
        <input type="email" name="email" id="email-input" placeholder="Email">
      </div>
      <div>
        <label for="password-input">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#5f6368"><path d="M280-240q-100 0-170-70T40-480q0-100 70-170t170-70q66 0 121 33t87 87h432v240h-80v120H600v-120H488q-32 54-87 87t-121 33Zm0-80q66 0 106-40.5t48-79.5h246v120h80v-120h80v-80H434q-8-39-48-79.5T280-640q-66 0-113 47t-47 113q0 66 47 113t113 47Zm0-80q33 0 56.5-23.5T360-480q0-33-23.5-56.5T280-560q-33 0-56.5 23.5T200-480q0 33 23.5 56.5T280-400Zm0-80Z"/></svg>
        </label>
        <input type="password" name="password" id="password-input" placeholder="Password">
      </div>
      <button type="submit">Login</button>
    </form>
    <p>New here? <a href="../HTML/signup.html">Create an Account</a></p>
  </div>
  <audio id="audio1" loop>
    <source src="../imageNvideo/milliondollarbaby.mp3"  type="audio/mpeg">
    </audio>
  <img id="playbutton"src="../imageNvideo/playbutton.png" style="width: 100px;" onclick="remove()">
    <style>
        #playbutton{
            position: fixed;
            bottom: 0;
            right: 0;
            width: 30px !important;   
            height: 30px;
            z-index: 1000;
        }
    </style>
</body>
<script>
  function remove() {
  document.getElementById('playbutton').addEventListener('click', function() {
      // Remove the button
      const audio = document.getElementById('audio1');
      audio.play().catch(error => {
      console.log('Playback error:', error);
  });
      this.remove();
  });
}
</script>
</html>
